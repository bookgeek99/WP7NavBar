name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDK="${ANDROID_HOME}"
          # ubuntu-latest runner 自带 Android SDK（含 cmdline-tools），只补装缺失的组件。
          yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${SDK}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"

      - name: Remove local aapt2 override
        # gradle.properties 的 aapt2FromMavenOverride 仅用于本地 arm64 容器，
        # CI（x86_64）必须移除，否则 aapt2 无法执行。
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'

      - name: Build release APK
        env:
          WP7_KEYSTORE_PASSWORD: ${{ secrets.WP7_KEYSTORE_PASSWORD }}
          WP7_KEY_PASSWORD: ${{ secrets.WP7_KEY_PASSWORD }}
          WP7_KEY_ALIAS: ${{ secrets.WP7_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WP7NavBar-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false